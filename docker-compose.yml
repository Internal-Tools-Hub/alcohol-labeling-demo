version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: alcohol-labeling-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alcohol_label_verification}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-alcohol_label_verification}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alcohol-labeling-network
    restart: unless-stopped

  # Streamlit Application
  app:
    build: .
    container_name: alcohol-labeling-app
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-alcohol_label_verification}
      
      # Google Cloud Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      
      # Application Configuration
      DEFAULT_ROLE: ${DEFAULT_ROLE:-admin}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      
      # Streamlit Configuration
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      
      # Google Cloud Credentials (if using service account key file)
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/credentials/service-account-key.json}
    volumes:
      # Development: mount source code for live reloading
      - ${VOLUME_MOUNT:-.}:/app
      - /app/__pycache__
      - /app/.pytest_cache
      # Production: read-only data and credentials
      - ./data:/app/data:ro
      - ./credentials:/app/credentials:ro
      - app_uploads:/app/uploads
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alcohol-labeling-network
    restart: unless-stopped
    # Development command with live reloading
    command: >
      sh -c "
        if [ "$${ENVIRONMENT:-development}" = "development" ]; then
          pip install --no-cache-dir watchdog &&
          streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.runOnSave=true
        else
          streamlit run app.py --server.port=8501 --server.address=0.0.0.0
        fi
      "

  # Nginx Reverse Proxy (production only)
  nginx:
    image: nginx:alpine
    container_name: alcohol-labeling-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - alcohol-labeling-network
    restart: unless-stopped
    # Only start nginx in production
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  nginx_logs:
    driver: local

networks:
  alcohol-labeling-network:
    driver: bridge