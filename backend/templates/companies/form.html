{% extends "base.html" %}
{% block content %}
<form method="post">
  {% csrf_token %}
  <div class="space-y-12">
    <div class="border-b border-gray-900/10 pb-12">
      <h2 class="text-base/7 font-semibold text-gray-900">Company</h2>
      <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
        <div class="sm:col-span-3">
          <label class="block text-sm/6 font-medium text-gray-900">Name</label>
          <div class="mt-2">{{ form.name }}</div>
        </div>
        <div class="col-span-full">
          <label class="block text-sm/6 font-medium text-gray-900">Description</label>
          <div class="mt-2">{{ form.description }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-6 flex items-center justify-end gap-x-3">
    <a href="{% url 'company_list' %}" class="relative cursor-pointer rounded-md bg-transparent font-semibold text-blue-600 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-blue-600 hover:text-blue-500">Cancel</a>
    <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Save</button>
  </div>
</form>
{% endblock %}
