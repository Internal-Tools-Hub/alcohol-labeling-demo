{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between">
  <h2 class="text-2xl font-semibold">Companies</h2>
  <a href="{% url 'company_create' %}" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">New</a>
</div>
<div class="mt-3 relative overflow-x-auto">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">Name</th>
        <th scope="col" class="px-6 py-3">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for c in companies %}
        <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
          <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
            <a class="font-medium text-blue-600 dark:text-blue-500 hover:underline" href="{% url 'company_detail' c.id %}">{{ c.name }}</a>
          </th>
          <td class="px-6 py-4">
            <a href="{% url 'company_update' c.id %}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Edit</a>
            <a href="{% url 'location_list' c.id %}" class="ml-3 font-medium text-blue-600 dark:text-blue-500 hover:underline">Locations</a>
          </td>
        </tr>
      {% empty %}
        <tr class="bg-white dark:bg-gray-800">
          <td class="px-6 py-4" colspan="2">No companies.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
