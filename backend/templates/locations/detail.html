{% extends "base.html" %}
{% block content %}
<nav class="flex mb-4 text-sm text-gray-600" aria-label="Breadcrumb">
  <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
    <li class="inline-flex items-center">
      <a href="{% url 'company_list' %}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Companies</a>
    </li>
    <li>
      <div class="flex items-center">
        <span class="mx-2">/</span>
        <a href="{% url 'company_detail' company.id %}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">{{ company.name }}</a>
      </div>
    </li>
  </ol>
  </nav>

<h2 class="text-2xl font-semibold mb-2">{{ location.name }}</h2>
<p class="text-gray-700">{{ location.city }}{% if location.state %}, {{ location.state }}{% endif %}{% if location.country %}, {{ location.country }}{% endif %}</p>
<div class="mt-4">
  <a class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800" href="{% url 'location_update' location.company.id location.id %}">Edit</a>
</div>
{% endblock %}
