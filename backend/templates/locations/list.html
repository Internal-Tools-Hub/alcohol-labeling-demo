{% extends "base.html" %}
{% block content %}
<nav class="flex mb-4 text-sm text-gray-600" aria-label="Breadcrumb">
  <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
    <li class="inline-flex items-center">
      <a href="{% url 'company_list' %}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Companies</a>
    </li>
    <li>
      <div class="flex items-center">
        <span class="mx-2">/</span>
        <a href="{% url 'company_detail' company.id %}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">{{ company.name }}</a>
      </div>
    </li>
  </ol>
  </nav>
<div class="flex items-center justify-between">
  <h2 class="text-2xl font-semibold">Locations for {{ company.name }}</h2>
  <a href="{% url 'location_create' company.id %}" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">New</a>
</div>
<div class="mt-3 relative overflow-x-auto">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">Name</th>
        <th scope="col" class="px-6 py-3">City</th>
        <th scope="col" class="px-6 py-3">State</th>
        <th scope="col" class="px-6 py-3">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for l in locations %}
        <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
          <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
            <a class="font-medium text-blue-600 dark:text-blue-500 hover:underline" href="{% url 'location_detail' company.id l.id %}">{{ l.name }}</a>
          </th>
          <td class="px-6 py-4">{{ l.city }}</td>
          <td class="px-6 py-4">{{ l.state }}</td>
          <td class="px-6 py-4">
            <a href="{% url 'location_update' company.id l.id %}" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Edit</a>
            <form method="post" action="{% url 'location_delete' company.id l.id %}" class="inline ml-3">
              {% csrf_token %}
              <button class="font-medium text-blue-600 dark:text-blue-500 hover:underline" onclick="return confirm('Delete this location?');">Delete</button>
            </form>
          </td>
        </tr>
      {% empty %}
        <tr class="bg-white dark:bg-gray-800">
          <td class="px-6 py-4" colspan="4">No locations.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
