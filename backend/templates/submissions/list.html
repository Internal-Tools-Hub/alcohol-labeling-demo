{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between">
  <h2 class="text-2xl font-semibold">Submissions</h2>
  <a href="{% url 'submission_create' %}" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">New</a>
</div>
<div class="mt-3 relative overflow-x-auto">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-3">ID</th>
        <th scope="col" class="px-6 py-3">Company</th>
        <th scope="col" class="px-6 py-3">Location</th>
        <th scope="col" class="px-6 py-3">Status</th>
        <th scope="col" class="px-6 py-3">Created</th>
      </tr>
    </thead>
    <tbody>
      {% for s in submissions %}
        <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200">
          <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
            <a class="font-medium text-blue-600 dark:text-blue-500 hover:underline" href="{% url 'submission_detail' s.id %}">#{{ s.id }}</a>
          </th>
          <td class="px-6 py-4">{{ s.company.name }}</td>
          <td class="px-6 py-4">{{ s.location.name }}</td>
          <td class="px-6 py-4">{{ s.status }}</td>
          <td class="px-6 py-4">{{ s.created_at }}</td>
        </tr>
      {% empty %}
        <tr class="bg-white dark:bg-gray-800">
          <td class="px-6 py-4" colspan="5">No submissions yet.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
